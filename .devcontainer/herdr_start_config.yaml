workspaces:
  - name: w1
    cwd: ..  # relative from this file
    tabs:
      # --------- codex -------------------------
      - label: sol_high
        panes:
          - kind: codex
            command: -p high
      - label: sol_medium
        panes:
          - kind: codex

      # --------- claude ------------------------
      - label: claude_opus
        panes:
          - kind: claude
            command: --model claude-opus-5
      - label: claude_medium
        panes:
          - kind: claude
            command: --model claude-sonnet-5

      # --------- copilot -----------------------
      # - label: copilot_medium
      #   panes:
      #     - kind: copilot --model gpt-5.6-terra

      # --------- shell commands ----------------
      - label: shells
        panes:
          - command: m test
            lf: false

      # --------- dev servers -------------------
      - label: dev_servers
        panes:
          - command: m m start-dev


