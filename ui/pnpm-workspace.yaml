packages:
  - "."

storeDir: ./.pnpm-store
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

allowBuilds:
  esbuild: true

# The 7-day delay also delays security patches. To install an urgent fix sooner,
# exempt that one package by listing it under minimumReleaseAgeExclude.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeStrict: false
